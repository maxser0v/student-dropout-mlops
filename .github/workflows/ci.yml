name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks-and-arm64-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt

      - name: Generate deterministic fictional dataset
        run: python scripts/generate_synthetic_data.py

      - name: Verify data bundle
        run: python scripts/verify_synthetic_data.py

      - name: Run automated checks
        run: python -m pytest -q

      - name: Prepare isolated smoke-test configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("config/model.yaml").read_text(encoding="utf-8"))
          config["model_name"] = "student-dropout-ci"
          Path("/tmp/ci-model.yaml").write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY

      - name: Run offline training-flow smoke test
        run: >-
          python flows/train_flow.py run
          --data-dir data
          --config-path /tmp/ci-model.yaml
          --tracking-uri sqlite:////tmp/student-dropout-ci.db

      - name: Set up QEMU for the pinned ARM64 image
        uses: docker/setup-qemu-action@v4

      - name: Compute verified source provenance
        id: provenance
        run: >-
          python scripts/demo_provenance.py
          --source-label github-actions
          --verify-commit "$GITHUB_SHA"
          --require-clean
          --github-output "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: student-dropout:ci
          build-args: |
            GIT_COMMIT=${{ steps.provenance.outputs.git_commit }}
            GIT_DIRTY=${{ steps.provenance.outputs.git_dirty }}
            SOURCE_TREE_SHA256=${{ steps.provenance.outputs.source_tree_sha256 }}
            SOURCE_REVISION_SOURCE=github-actions
            SOURCE_TREE_HASH_ALGORITHM=sha256

      - name: Verify the image default user is non-root
        run: >-
          docker run --rm --platform linux/arm64 --entrypoint python student-dropout:ci
          -c 'import os, pwd; uid=os.getuid(); assert uid > 0; entry=pwd.getpwuid(uid); print(f"uid={uid} home={entry.pw_dir}")'

  plagiarism-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Resolve isolated runtime and test dependencies
        run: uv sync --directory plagiarism-runtime --group test

      - name: Run plagiarism unit checks and fixture release workflow with XGBoost
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
          METAFLOW_USER: github-actions
          METAFLOW_DATASTORE_SYSROOT_LOCAL: ${{ github.workspace }}/artifacts/plagiarism/metaflow
          METAFLOW_CARD_LOCALROOT: ${{ github.workspace }}/artifacts/plagiarism/mf.cards
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          mkdir -p reports/plagiarism artifacts/plagiarism
          uv run --directory plagiarism-runtime python -m pytest -q \
            "$GITHUB_WORKSPACE/tests/test_plagiarism_core.py" \
            "$GITHUB_WORKSPACE/tests/test_plagiarism_data.py" \
            "$GITHUB_WORKSPACE/tests/test_plagiarism_score.py" \
            "$GITHUB_WORKSPACE/tests/test_plagiarism_workflow_contract.py" \
            "$GITHUB_WORKSPACE/tests/test_plagiarism_workflow_eval.py"
          uv run --directory plagiarism-runtime python "$GITHUB_WORKSPACE/scripts/plagiarism_fixture_workflow.py" \
            --tracking-uri sqlite:////tmp/plagiarism-fixture-ci.db \
            --output-dir /tmp/plagiarism-fixture-ci
