config_version: "1.0-fixture"
model_name: passage-reuse-fixture
seed: 903
target:
  version: passage-reuse-pair-classifier-v1
  description: Fixture-only passage reuse model; not a benchmark release.
feature_schema:
  version: "1.0"
  columns: [minilm_cosine, tfidf_cosine, shared_word_ngram_overlap, rare_term_overlap, length_ratio]
chunking:
  target_tokens: 60
  overlap_tokens: 6
  max_tokens: 76
  top_k: 5
  min_span_coverage: 0.5
threshold_selection:
  requested_shared_recall: 0.5
gates:
  minimum_recall: 0.5
  maximum_recall_drop: 0.05
  minimum_false_alert_reduction: 1
  require_strict_false_alert_improvement: true
  validation_only_thresholds: true
data:
  validation_fraction: 0.2
  split_seed: 903
  fixture_model_name: passage-reuse-fixture
training:
  n_estimators: 24
  max_depth: 3
  learning_rate: 0.1
