config_version: "1.1"
model_name: student-dropout
seed: 903
target:
  version: withdrawal-after-day-35-by-course-end-v1
  description: Withdrawal after the day-35 cutoff and by course end, conditional on active enrolment at cutoff.
feature_schema:
  version: "1.0"
  columns:
    - active_days_14d
    - active_days_previous_14d
    - interactions_14d
    - interactions_previous_14d
    - resource_views_14d
    - forum_posts_14d
