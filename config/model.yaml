    - assignments_due_to_date
    - scores_available_count
    - mean_score_pct_to_date
    - missed_assignments
    - activity_change
    - days_since_last_activity
    - no_activity_history
threshold_selection:
  lower: 0.05
  upper: 0.95
  step: 0.05
  minimum_precision: 0.30
gates:
  average_precision_above_prevalence: 0.05
  minimum_recall: 0.80
  minimum_precision: 0.30
  maximum_recall_drop: 0.05
  maximum_precision_drop: 0.05
  maximum_brier_increase: 0.02
